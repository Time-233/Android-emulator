name: build-husk

on:
  workflow_dispatch:
    inputs:
      husk_ref:
        description: "Husk 的 tag / 分支 / commit"
        default: "3.4"
        required: true
      mode:
        description: "app = 应用层源码编译（原生核取上游成品，快）；full = 原生核也全部交叉编译（慢，可能失败）"
        default: "app"
        type: choice
        options:
          - app
          - full

permissions:
  contents: read

jobs:
  build:
    name: Husk IPA (${{ inputs.mode }} · ${{ inputs.husk_ref }})
    runs-on: macos-26
    timeout-minutes: 350
    env:
      HUSK_REF: ${{ inputs.husk_ref }}
      MODE: ${{ inputs.mode }}

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          ls /Applications | grep -i '^Xcode' || true
          NEWEST="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)"
          echo "selected: $NEWEST"
          if [ -n "$NEWEST" ]; then
            sudo xcode-select -s "$NEWEST"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"

      - name: Toolchain
        run: |
          set -euo pipefail
          brew update >/dev/null 2>&1 || true
          brew install xcodegen qemu 2>&1 | tail -n 8
          if ! command -v cargo >/dev/null 2>&1; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add aarch64-apple-ios
          echo "qemu-img : $(command -v qemu-img || echo MISSING)"
          echo "xcodegen : $(command -v xcodegen || echo MISSING)"
          echo "cargo    : $(command -v cargo)"
          xcodegen --version

      - name: Clone Husk
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/Leviidev/Husk.git husk
          cd husk
          git checkout --quiet "$HUSK_REF"
          echo "building $(git log -1 --format='%h %s')"
          echo "HUSK_COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Build native cores from source (mode=full)
        if: inputs.mode == 'full'
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cd husk
          ./scripts/fetch_sources.sh
          ./scripts/build_ios.sh libffi glib pixman libucontext libslirp
          cp build/ios-arm64/cross-darwin.meson build/ios-arm64/cross-ios-darwin.meson
          ./scripts/build_angle_ios.sh || echo "::warning::ANGLE 构建失败，将从上游成品补齐"
          PKG_CONFIG_LIBDIR="$PWD/build/ios-arm64/sysroot/lib/pkgconfig:$PWD/build/ios-arm64/sysroot/share/pkgconfig" \
            ./scripts/build_gpu_ios.sh || echo "::warning::virglrenderer 失败，将从上游成品补齐"
          ./scripts/build_ios.sh qemu
          ./scripts/integrate_husk.sh
          ./scripts/build_ios.sh qemurebuild
          ./scripts/fetch_phase0_guest.sh
          ./scripts/build_moltenvk_ios.sh || echo "::warning::MoltenVK 失败，将从上游成品补齐"
          ./scripts/build_ps4_ios.sh || echo "::warning::PS4 层失败，将从上游成品补齐"

      - name: Cache upstream release IPA
        uses: actions/cache@v4
        with:
          path: /tmp/husk-upstream
          key: husk-upstream-${{ inputs.husk_ref }}

      - name: Harvest native artifacts from upstream release
        if: inputs.mode == 'app'
        run: bash husk-build/harvest_upstream.sh husk

      - name: Fill gaps from upstream release
        if: inputs.mode == 'full'
        run: bash husk-build/harvest_upstream.sh husk --only-missing

      - name: Raise app deployment target
        run: |
          # 上游用 iOS 15.5 作 app 的部署目标，但 ProfileView 用到的 ViewBuilder.buildIf
          # 在 SDK 26 里标成了 iOS 16+，Xcode 26 会直接报错。目标机是 iOS 27，抬到 17.0 没有副作用。
          cd husk
          python3 - <<'PY'
          import pathlib
          path = pathlib.Path("src/app/project.yml")
          text = path.read_text()
          old = 'iOS: "15.5"'
          if old in text:
              path.write_text(text.replace(old, 'iOS: "17.0"'))
              print("deployment target 15.5 -> 17.0")
          else:
              print("already raised or not found:", old)
          PY
          grep -n 'iOS:' src/app/project.yml || true

      - name: Build rppairing (Rust) + package IPA
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          mkdir -p out
          cd husk
          ./scripts/build_rppairing_ios.sh
          ./scripts/package_ipa.sh "$GITHUB_WORKSPACE/out/Husk-$HUSK_REF.ipa"
          ./scripts/package_ipa.sh --trollstore "$GITHUB_WORKSPACE/out/Husk-$HUSK_REF.tipa"
          ls -lh "$GITHUB_WORKSPACE"/out

      - name: Summarise
        if: always()
        run: |
          shopt -s nullglob
          {
            echo "### Husk $HUSK_REF ($MODE)"
            echo ""
            echo "- commit: \`${HUSK_COMMIT:-?}\`"
            echo "- runner: macOS $(sw_vers -productVersion) / $(uname -m) / $(xcodebuild -version | head -1)"
            files=(out/*.ipa out/*.tipa)
            if [ ${#files[@]} -eq 0 ]; then
              echo "- 没有产物"
            else
              for f in "${files[@]}"; do
                echo "- \`$(basename "$f")\` $(du -h "$f" | cut -f1) sha256=\`$(shasum -a 256 "$f" | cut -d' ' -f1)\`"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Husk-${{ inputs.husk_ref }}-${{ inputs.mode }}
          path: |
            out/*.ipa
            out/*.tipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: husk-build-logs
          path: |
            /tmp/husk_ipa/build.log
            husk/build/logs/**
          if-no-files-found: ignore
          retention-days: 7
